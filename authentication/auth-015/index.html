<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AUTH-015 — Login Error States | UIXForge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Custom Cursor -->
  <div class="cursor" id="cursor"></div>
  <div class="cursor-dot" id="cursorDot"></div>

  <!-- Particle Canvas -->
  <canvas id="particleCanvas"></canvas>

  <!-- Ambient Orbs -->
  <div class="ambient-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
  </div>

  <!-- Grid Overlay -->
  <div class="grid-overlay"></div>

  <!-- Orbit Rings -->
  <div class="orbit-container">
    <div class="orbit-ring outer"><div class="orbit-dot purple"></div></div>
    <div class="orbit-ring middle"><div class="orbit-dot cyan"></div></div>
    <div class="orbit-ring inner"><div class="orbit-dot gold"></div></div>
  </div>

  <!-- Main Wrapper -->
  <div class="main-wrapper">
    <div class="login-card" id="loginCard">
      <div class="card-glare" id="cardGlare"></div>

      <div class="card-content">
        <!-- Brand -->
        <div class="brand-section">
          <div class="logo-container">
            <svg class="logo-svg" viewBox="0 0 60 60" fill="none">
              <defs><linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6c5ce7"/><stop offset="100%" stop-color="#00cec9"/></linearGradient></defs>
              <path d="M30 5L52 17V41L30 53L8 41V17L30 5Z" stroke="url(#logoGrad)" stroke-width="2.2" fill="none"/>
              <circle cx="30" cy="29" r="9" fill="url(#logoGrad)" opacity="0.85"/>
            </svg>
            <div class="logo-pulse"></div>
          </div>
          <h1 class="brand-title"><span class="title-gradient">UIXForge</span></h1>
          <p class="brand-tagline">Where Design Meets Reality</p>
        </div>

        <!-- Welcome -->
        <div class="welcome-section">
          <h2 class="welcome-title">Welcome Back</h2>
          <p class="welcome-subtitle">Sign in to continue to your account</p>
        </div>

        <!-- Error Display Area -->
        <div class="error-display" id="errorDisplay">
          <div class="error-icon" id="errorIcon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          </div>
          <div class="error-content">
            <span class="error-title" id="errorTitle">Invalid Credentials</span>
            <span class="error-desc" id="errorDesc">The email or password you entered is incorrect.</span>
          </div>
        </div>

        <!-- Form -->
        <form class="login-form" id="loginForm" novalidate>
          <div class="input-group">
            <div class="input-field-wrapper">
              <span class="field-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 4L12 14 2 4"/></svg>
              </span>
              <input type="email" class="form-field" id="emailInput" placeholder=" " autocomplete="email" required>
              <label class="floating-label">Email Address</label>
              <span class="field-status" id="emailStatus"></span>
            </div>
            <div class="inline-error" id="emailError"></div>
          </div>

          <div class="input-group">
            <div class="input-field-wrapper">
              <span class="field-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </span>
              <input type="password" class="form-field" id="passwordInput" placeholder=" " autocomplete="current-password" required>
              <label class="floating-label">Password</label>
              <button type="button" class="toggle-password" data-target="passwordInput">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
              <span class="field-status" id="passwordStatus"></span>
            </div>
            <div class="inline-error" id="passwordError"></div>
          </div>

          <div class="options-row">
            <label class="checkbox-wrapper">
              <input type="checkbox"><span class="checkbox-custom">✓</span>
              <span class="checkbox-label">Remember me</span>
            </label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>

          <button type="submit" class="submit-btn" id="loginBtn">
            <span class="btn-text">Sign In →</span>
            <span class="btn-spinner"></span>
            <div class="btn-shimmer"></div>
          </button>
        </form>

        <!-- Error Demo Buttons -->
        <div class="demo-section">
          <span class="demo-label">Demo Error States:</span>
          <div class="demo-buttons">
            <button class="demo-btn" data-error="credentials">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              Invalid Credentials
            </button>
            <button class="demo-btn" data-error="empty">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              Empty Fields
            </button>
            <button class="demo-btn" data-error="locked">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              Account Locked
            </button>
            <button class="demo-btn" data-error="network">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/></svg>
              Network Error
            </button>
            <button class="demo-btn" data-error="rate-limit">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              Rate Limited
            </button>
          </div>
        </div>

        <div class="divider-section">
          <span class="divider-line"></span><span class="divider-text">or continue with</span><span class="divider-line"></span>
        </div>

        <div class="social-buttons">
          <button class="social-btn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/></svg></button>
          <button class="social-btn"><svg viewBox="0 0 24 24" fill="#6e5494"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg></button>
          <button class="social-btn"><svg viewBox="0 0 24 24" fill="white"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg></button>
        </div>

        <p class="signup-text">Don't have an account? <a href="#" class="signup-link">Create one →</a></p>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="script.js"></script>
</body>
</html>
