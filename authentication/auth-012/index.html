<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AUTH-012 — Animated Login Background | UIXForge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============================================ -->
  <!-- ANIMATED BACKGROUND LAYER                     -->
  <!-- ============================================ -->
  <div class="animated-bg" id="animatedBg">
    <!-- Gradient Waves (4) -->
    <div class="wave wave-1"></div>
    <div class="wave wave-2"></div>
    <div class="wave wave-3"></div>
    <div class="wave wave-4"></div>

    <!-- Floating Geometric Shapes (7) -->
    <div class="floating-shapes">
      <div class="shape shape-circle shape-1"></div>
      <div class="shape shape-square shape-2"></div>
      <div class="shape shape-triangle shape-3"></div>
      <div class="shape shape-diamond shape-4"></div>
      <div class="shape shape-circle shape-5"></div>
      <div class="shape shape-square shape-6"></div>
      <div class="shape shape-hexagon shape-7"></div>
    </div>

    <!-- Particle Canvas -->
    <canvas id="particleCanvas"></canvas>

    <!-- Ambient Orbs (4) -->
    <div class="ambient-orbs">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
      <div class="orb orb-4"></div>
    </div>

    <!-- Grid Overlay -->
    <div class="grid-overlay"></div>

    <!-- Orbit Rings (3) -->
    <div class="orbit-container">
      <div class="orbit-ring outer"><div class="orbit-dot purple"></div></div>
      <div class="orbit-ring middle"><div class="orbit-dot cyan"></div></div>
      <div class="orbit-ring inner"><div class="orbit-dot gold"></div></div>
    </div>

    <!-- Glow Spots (4) -->
    <div class="glow-spot glow-spot-1"></div>
    <div class="glow-spot glow-spot-2"></div>
    <div class="glow-spot glow-spot-3"></div>
    <div class="glow-spot glow-spot-4"></div>
  </div>

  <!-- Center Text -->
  <div class="center-text" id="centerText">Animated<br>Background</div>

  <script src="script.js"></script>
</body>
</html>
